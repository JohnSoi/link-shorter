name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Ruff
        run: uv tool install ruff

      - name: Ruff check
        run: uv run ruff check link_shorter

      - name: Ruff format
        run: uv run ruff format --check link_shorter

      - name: PyLint check
        run: uv run pylint link_shorter

      - name: PyRight check
        run: uv run pyright link_shorter

      - name: Radon check
        run: uv run radon cc -nb link_shorter
