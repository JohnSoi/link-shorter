name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Ruff
        run: uv tool install ruff

      - name: Ruff check
        run: uvx ruff check link_shorter

      - name: Ruff format
        run: uvx ruff format --check link_shorter

  other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install tools
        run: |
          uv tool install pylint
          uv tool install pyright
          uv tool install radon

      - name: PyLint check
        run: uvx pylint link_shorter

      - name: PyRight check
        run: uvx pyright link_shorter

      - name: Radon check
        run: uvx radon cc link_shorter
