name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bl-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Ruff
        run: uv tool install ruff

      - name: Ruff check
        run: uv run ruff check link_shorter

      - name: Ruff format
        run: uv run ruff format --check link_shorter

      - name: PyLint check
        run: uv run pylint link_shorter

      - name: PyRight check
        run: uv run pyright link_shorter

      - name: Radon check
        run: uv run radon cc -nb link_shorter

  ui-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: ESLint check
        run: npx eslint .

      - name: Prettier format check
        run: npx prettier --check src/

      - name: TypeScript check
        run: npx vue-tsc --noEmit
